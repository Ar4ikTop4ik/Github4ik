<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Game - Smooth Animation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #17153b 50%, #090d16 100%);
            min-height: 100vh;
            color: #f8fafc;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Tile dynamic color themes */
        .tile-2 { background: rgba(59, 130, 246, 0.18); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.35); }
        .tile-4 { background: rgba(59, 130, 246, 0.3); color: #bfdbfe; border: 1px solid rgba(59, 130, 246, 0.5); }
        .tile-8 { background: rgba(249, 115, 22, 0.28); color: #fed7aa; border: 1px solid rgba(249, 115, 22, 0.45); }
        .tile-16 { background: rgba(249, 115, 22, 0.45); color: #ffedd5; border: 1px solid rgba(249, 115, 22, 0.65); }
        .tile-32 { background: rgba(239, 68, 68, 0.35); color: #fecaca; border: 1px solid rgba(239, 68, 68, 0.55); }
        .tile-64 { background: rgba(239, 68, 68, 0.55); color: #fee2e2; border: 1px solid rgba(239, 68, 68, 0.75); }
        .tile-128 { background: rgba(234, 179, 8, 0.35); color: #fef08a; border: 1px solid rgba(234, 179, 8, 0.6); font-size: 1.7rem; }
        .tile-256 { background: rgba(234, 179, 8, 0.5); color: #fef9c3; border: 1px solid rgba(234, 179, 8, 0.75); font-size: 1.7rem; }
        .tile-512 { background: rgba(234, 179, 8, 0.65); color: #ffffff; border: 1px solid rgba(234, 179, 8, 0.9); font-size: 1.7rem; }
        .tile-1024 { background: rgba(168, 85, 247, 0.45); color: #f3e8ff; border: 1px solid rgba(168, 85, 247, 0.75); font-size: 1.4rem; }
        .tile-2048 { background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.7); font-size: 1.4rem; box-shadow: 0 0 25px rgba(168, 85, 247, 0.6); }
        .tile-super { background: linear-gradient(135deg, #ec4899 0%, #ef4444 100%); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.9); font-size: 1.2rem; box-shadow: 0 0 35px rgba(236, 72, 153, 0.8); }

        .tile {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            border-radius: 1rem;
            transition: transform 0.15s ease-in-out, background 0.15s ease-in-out;
            will-change: transform, left, top;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes mergePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .tile-new {
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .tile-merged {
            animation: mergePop 0.18s ease-in-out forwards;
            z-index: 10;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 min-h-screen select-none">

    <div class="w-full max-w-md mb-6 flex items-center justify-between">
        <div>
            <h1 class="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">2048</h1>
            <p class="text-xs text-slate-400 mt-1 font-medium">Плавное скольжение и сдвиг в ячейки</p>
        </div>
        <div class="flex gap-2">
            <div class="glass-card px-3 py-1.5 rounded-xl text-center min-w-[70px]">
                <div class="text-[10px] uppercase tracking-wider text-slate-400 font-bold">Счет</div>
                <div id="current-score" class="text-lg font-bold text-white">0</div>
            </div>
            <div class="glass-card px-3 py-1.5 rounded-xl text-center min-w-[70px]">
                <div class="text-[10px] uppercase tracking-wider text-slate-400 font-bold">Рекорд</div>
                <div id="best-score" class="text-lg font-bold text-amber-400">0</div>
            </div>
        </div>
    </div>

    <div class="w-full max-w-md mb-4 flex items-center justify-between">
        <div class="text-xs text-slate-400 hidden sm:block">
            Управление: <span class="text-slate-200 font-semibold">Стрелки / WASD</span>
        </div>
        <button id="restart-btn" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold text-sm shadow-lg shadow-indigo-500/25 transition-all transform active:scale-95 cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Новая игра
        </button>
    </div>

    <div id="board-wrapper" class="relative glass-panel p-3 sm:p-4 rounded-3xl w-full max-w-md aspect-square shadow-2xl overflow-hidden">
        <div id="grid-container" class="grid grid-cols-4 grid-rows-4 gap-2.5 sm:gap-3.5 w-full h-full relative">
            <div class="bg-white/5 rounded-2xl w-full h-full"></div>
            <div class="bg-white/5 rounded-2xl w-full h-full"></div>
            <div class="bg-white/5 rounded-2xl w-full h-full"></div>
            <div class="bg-white/5 rounded-2xl w-full h-full"></div>
            <div class="bg-white/5 rounded-2xl w-full h-full"></div>
            <div class="bg-white/5 rounded-2xl w-full h-full"></div>
            <div class="bg-white/5 rounded-2xl w-full h-full"></div>
            <div class="bg-white/5 rounded-2xl w-full h-full"></div>
            <div class="bg-white/5 rounded-2xl w-full h-full"></div>
            <div class="bg-white/5 rounded-2xl w-full h-full"></div>
            <div class="bg-white/5 rounded-2xl w-full h-full"></div>
            <div class="bg-white/5 rounded-2xl w-full h-full"></div>
            <div class="bg-white/5 rounded-2xl w-full h-full"></div>
            <div class="bg-white/5 rounded-2xl w-full h-full"></div>
            <div class="bg-white/5 rounded-2xl w-full h-full"></div>
            <div class="bg-white/5 rounded-2xl w-full h-full"></div>
        </div>

        <!-- Tiles Layer with absolute positioning for slide animations -->
        <div id="tiles-container" class="absolute inset-3 sm:inset-4 pointer-events-none"></div>

        <!-- Game Over / Victory Modal Overlay -->
        <div id="game-overlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-md rounded-3xl flex flex-col items-center justify-center p-6 text-center opacity-0 pointer-events-none transition-all duration-300 z-50">
            <h2 id="overlay-title" class="text-3xl font-extrabold mb-2 text-white">Победа!</h2>
            <p id="overlay-text" class="text-sm text-slate-300 mb-6">Вы успешно собрали плитку 2048.</p>
            <div class="flex gap-3">
                <button id="overlay-continue-btn" class="hidden px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-sm transition-all border border-white/10 cursor-pointer">Продолжить</button>
                <button id="overlay-restart-btn" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold text-sm shadow-lg shadow-indigo-500/30 transition-all cursor-pointer">Играть снова</button>
            </div>
        </div>
    </div>

    <div class="mt-6 text-xs text-slate-400 text-center sm:hidden">
        Используйте свайпы или клавиатуру для управления
    </div>

    <script>
        class Game2048 {
            constructor() {
                this.gridSize = 4;
                // Each cell stores tile object or null: { id, value, r, c, mergedInto, isNew }
                this.board = Array(this.gridSize).fill().map(() => Array(this.gridSize).fill(null));
                this.score = 0;
                this.bestScore = parseInt(localStorage.getItem('bestScore_2048_smooth')) || 0;
                this.won = false;
                this.keepPlaying = false;
                this.over = false;
                this.nextId = 1;
                this.isAnimating = false;

                this.tilesContainer = document.getElementById('tiles-container');
                this.scoreEl = document.getElementById('current-score');
                this.bestScoreEl = document.getElementById('best-score');
                this.overlay = document.getElementById('game-overlay');
                this.overlayTitle = document.getElementById('overlay-title');
                this.overlayText = document.getElementById('overlay-text');
                this.continueBtn = document.getElementById('overlay-continue-btn');
                this.restartBtn = document.getElementById('overlay-restart-btn');

                this.bestScoreEl.textContent = this.bestScore;
                this.initListeners();
                this.setupTouchGestures();
                this.startNewGame();
            }

            startNewGame() {
                this.board = Array(this.gridSize).fill().map(() => Array(this.gridSize).fill(null));
                this.score = 0;
                this.won = false;
                this.keepPlaying = false;
                this.over = false;
                this.nextId = 1;
                this.hideOverlay();
                this.updateScore(0);
                
                this.addRandomTile(true);
                this.addRandomTile(true);
                this.render(false);
            }

            addRandomTile(isInitial = false) {
                let emptyCells = [];
                for (let r = 0; r < this.gridSize; r++) {
                    for (let c = 0; c < this.gridSize; c++) {
                        if (this.board[r][c] === null) {
                            emptyCells.push({r, c});
                        }
                    }
                }
                if (emptyCells.length > 0) {
                    let cell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    let val = Math.random() < 0.9 ? 2 : 4;
                    this.board[cell.r][cell.c] = {
                        id: this.nextId++,
                        value: val,
                        r: cell.r,
                        c: cell.c,
                        isNew: !isInitial
                    };
                }
            }

            updateScore(increment) {
                if (increment > 0) {
                    this.score += increment;
                    if (this.score > this.bestScore) {
                        this.bestScore = this.score;
                        localStorage.setItem('bestScore_2048_smooth', this.bestScore);
                        this.bestScoreEl.textContent = this.bestScore;
                    }
                }
                this.scoreEl.textContent = this.score;
                this.bestScoreEl.textContent = this.bestScore;
            }

            getCoordinates(r, c) {
                // Returns percentage positions for absolute sliding layout
                const gap = 10; // gap in pixels (approx matching Tailwind gap-2.5 / gap-3.5)
                return {
                    left: `calc(${c} * (100% - ${3 * gap}px) / 4 + ${c * gap}px)`,
                    top: `calc(${r} * (100% - ${3 * gap}px) / 4 + ${r * gap}px)`,
                    width: `calc((100% - ${3 * gap}px) / 4)`,
                    height: `calc((100% - ${3 * gap}px) / 4)`
                };
            }

            render(animate = true) {
                // Collect all active tiles
                let activeTiles = [];
                for (let r = 0; r < this.gridSize; r++) {
                    for (let c = 0; c < this.gridSize; c++) {
                        if (this.board[r][c] !== null) {
                            activeTiles.push(this.board[r][c]);
                        }
                    }
                }

                this.tilesContainer.innerHTML = '';

                activeTiles.forEach(tile => {
                    let el = document.createElement('div');
                    let tileClass = tile.value <= 2048 ? `tile-${tile.value}` : 'tile-super';
                    el.className = `tile ${tileClass}`;
                    
                    if (tile.isNew) {
                        el.classList.add('tile-new');
                        tile.isNew = false;
                    }
                    if (tile.isMerged) {
                        el.classList.add('tile-merged');
                        tile.isMerged = false;
                    }

                    const coords = this.getCoordinates(tile.r, tile.c);
                    el.style.left = coords.left;
                    el.style.top = coords.top;
                    el.style.width = coords.width;
                    el.style.height = coords.height;

                    el.textContent = tile.value;
                    this.tilesContainer.appendChild(el);
                });
            }

            move(direction) {
                if (this.over || this.isAnimating) return;

                // Directions mapping to vector [rowDelta, colDelta]
                let vectors = {
                    'up': [-1, 0],
                    'down': [1, 0],
                    'left': [0, -1],
                    'right': [0, 1]
                };
                let vector = vectors[direction];
                let traversals = this.buildTraversals(vector);
                let moved = false;
                let addedScore = 0;

                // Reset temporary flags
                for (let r = 0; r < this.gridSize; r++) {
                    for (let c = 0; c < this.gridSize; c++) {
                        if (this.board[r][c]) {
                            this.board[r][c].mergedInto = null;
                            this.board[r][c].isMerged = false;
                        }
                    }
                }

                traversals.row.forEach(r => {
                    traversals.col.forEach(c => {
                        let tile = this.board[r][c];
                        if (tile !== null) {
                            let pos = this.findFarthestPosition({r, c}, vector);
                            let nextCell = pos.next;

                            // Check if we can merge with adjacent tile
                            if (this.isValidPosition(nextCell) && 
                                this.board[nextCell.r][nextCell.c] !== null && 
                                this.board[nextCell.r][nextCell.c].value === tile.value && 
                                !this.board[nextCell.r][nextCell.c].mergedInto) {
                                
                                let mergedValue = tile.value * 2;
                                let targetTile = this.board[nextCell.r][nextCell.c];

                                // Move current tile onto target position for animation
                                tile.r = nextCell.r;
                                tile.c = nextCell.c;

                                // Update grid state
                                this.board[r][c] = null;
                                targetTile.value = mergedValue;
                                targetTile.isMerged = true;
                                tile.mergedInto = targetTile;

                                addedScore += mergedValue;
                                moved = true;

                                if (mergedValue === 2048 && !this.won && !this.keepPlaying) {
                                    this.won = true;
                                }
                            } else if (pos.farthest.r !== r || pos.farthest.c !== c) {
                                // Normal move into empty cell (even if tiles don't merge!)
                                this.board[r][c] = null;
                                tile.r = pos.farthest.r;
                                tile.c = pos.farthest.c;
                                this.board[tile.r][tile.c] = tile;
                                moved = true;
                            }
                        }
                    });
                });

                if (moved) {
                    this.isAnimating = true;
                    this.render(true);

                    setTimeout(() => {
                        // Clean up merged source tiles and finalize positions
                        for (let r = 0; r < this.gridSize; r++) {
                            for (let c = 0; c < this.gridSize; c++) {
                                if (this.board[r][c] && this.board[r][c].mergedInto) {
                                    this.board[r][c] = null;
                                }
                            }
                        }
                        this.updateScore(addedScore);
                        this.addRandomTile();
                        this.render(false);
                        this.isAnimating = false;

                        if (this.won && !this.keepPlaying) {
                            this.showVictoryModal();
                        } else if (!this.hasAvailableMoves()) {
                            this.showGameOverModal();
                        }
                    }, 160); // Match CSS transition duration
                }
            }

            buildTraversals(vector) {
                let traversals = { row: [], col: [] };
                for (let i = 0; i < this.gridSize; i++) {
                    traversals.row.push(i);
                    traversals.col.push(i);
                }
                if (vector[0] === 1) traversals.row.reverse();
                if (vector[1] === 1) traversals.col.reverse();
                return traversals;
            }

            findFarthestPosition(cell, vector) {
                let farthest;
                let previous;
                do {
                    previous = cell;
                    cell = { r: previous.r + vector[0], c: previous.c + vector[1] };
                } while (this.isValidPosition(cell) && this.board[cell.r][cell.c] === null);

                return {
                    farthest: previous,
                    next: cell
                };
            }

            isValidPosition(cell) {
                return cell.r >= 0 && cell.r < this.gridSize && cell.c >= 0 && cell.c < this.gridSize;
            }

            hasAvailableMoves() {
                for (let r = 0; r < this.gridSize; r++) {
                    for (let c = 0; c < this.gridSize; c++) {
                        if (this.board[r][c] === null) return true;
                        if (c + 1 < this.gridSize && this.board[r][c] && this.board[r][c+1] && this.board[r][c].value === this.board[r][c+1].value) return true;
                        if (r + 1 < this.gridSize && this.board[r][c] && this.board[r+1][c] && this.board[r][c].value === this.board[r+1][c].value) return true;
                    }
                }
                return false;
            }

            showVictoryModal() {
                this.overlayTitle.textContent = "Победа!";
                this.overlayText.textContent = "Поздравляем! Вы собрали плитку 2048.";
                this.continueBtn.classList.remove('hidden');
                this.overlay.classList.remove('opacity-0', 'pointer-events-none');
            }

            showGameOverModal() {
                this.over = true;
                this.overlayTitle.textContent = "Игра окончена";
                this.overlayText.textContent = "Больше нет доступных ходов. Попробуйте еще раз!";
                this.continueBtn.classList.add('hidden');
                this.overlay.classList.remove('opacity-0', 'pointer-events-none');
            }

            hideOverlay() {
                this.overlay.classList.add('opacity-0', 'pointer-events-none');
            }

            initListeners() {
                window.addEventListener('keydown', (e) => {
                    switch (e.key) {
                        case 'ArrowLeft':
                        case 'a':
                        case 'A':
                            e.preventDefault();
                            this.move('left');
                            break;
                        case 'ArrowRight':
                        case 'd':
                        case 'D':
                            e.preventDefault();
                            this.move('right');
                            break;
                        case 'ArrowUp':
                        case 'w':
                        case 'W':
                            e.preventDefault();
                            this.move('up');
                            break;
                        case 'ArrowDown':
                        case 's':
                        case 'S':
                            e.preventDefault();
                            this.move('down');
                            break;
                    }
                });

                document.getElementById('restart-btn').addEventListener('click', () => {
                    this.startNewGame();
                });

                this.restartBtn.addEventListener('click', () => {
                    this.startNewGame();
                });

                this.continueBtn.addEventListener('click', () => {
                    this.keepPlaying = true;
                    this.hideOverlay();
                });
            }

            setupTouchGestures() {
                let startX, startY;
                const wrapper = document.getElementById('board-wrapper');

                wrapper.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                    e.preventDefault();
                }, { passive: false });

                wrapper.addEventListener('touchend', (e) => {
                    if (!startX || !startY) return;
                    let endX = e.changedTouches[0].clientX;
                    let endY = e.changedTouches[0].clientY;

                    let diffX = endX - startX;
                    let diffY = endY - startY;

                    if (Math.abs(diffX) > Math.abs(diffY)) {
                        if (Math.abs(diffX) > 25) {
                            if (diffX > 0) this.move('right');
                            else this.move('left');
                        }
                    } else {
                        if (Math.abs(diffY) > 25) {
                            if (diffY > 0) this.move('down');
                            else this.move('up');
                        }
                    }
                    startX = null;
                    startY = null;
                    e.preventDefault();
                }, { passive: false });
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new Game2048();
        });
    </script>
</body>
</html>
